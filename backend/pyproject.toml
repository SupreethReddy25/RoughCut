[project]
name = "roughcut-backend"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "sqlmodel",
  "python-multipart",
  "pydantic>=2",
  "numpy",
  "httpx",
  "faster-whisper",
  "rapidfuzz",
  "opencv-python-headless",
  "sentence-transformers",
  "fonttools",
  "scipy",
  "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["slow: runs the real pipeline (ffmpeg + Whisper + MiniLM); deselect with -m 'not slow'"]

[tool.ruff]
line-length = 110
exclude = [".venv"]

[tool.setuptools]
packages = ["app", "sim"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Form"]
